<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Exercícios em Portugol</title>
  <desc id="desc">Banner animado de uma janela de código com símbolos de programação.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="40" r="130" fill="#38bdf8" opacity="0.06">
    <animate attributeName="r" values="115;145;115" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="250" r="90" fill="#5eead4" opacity="0.07">
    <animate attributeName="cy" values="250;225;250" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <rect x="58" y="44" width="420" height="212" rx="18" fill="#020617" opacity="0.94" stroke="#334155"/>
    <rect x="58" y="44" width="420" height="38" rx="18" fill="#1e293b"/>
    <rect x="58" y="64" width="420" height="18" fill="#1e293b"/>
    <circle cx="84" cy="63" r="6" fill="#fb7185"/>
    <circle cx="105" cy="63" r="6" fill="#fbbf24"/>
    <circle cx="126" cy="63" r="6" fill="#4ade80"/>

    <g font-family="Consolas, 'Courier New', monospace" font-size="20">
      <text x="86" y="116" fill="#7dd3fc">programa</text>
      <text x="187" y="116" fill="#e2e8f0">{</text>
      <text x="105" y="151" fill="#c4b5fd">funcao inicio()</text>
      <text x="277" y="151" fill="#e2e8f0">{</text>
      <text x="125" y="186" fill="#5eead4">escreva</text>
      <text x="215" y="186" fill="#f8fafc">("Olá, lógica!")</text>
      <text x="105" y="221" fill="#e2e8f0">}</text>
      <text x="86" y="246" fill="#e2e8f0">}</text>
      <rect x="402" y="168" width="10" height="23" rx="2" fill="#5eead4">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="540" y="118" fill="#f8fafc" font-size="48" font-weight="800" letter-spacing="1">EXERCÍCIOS EM</text>
    <text x="540" y="174" fill="url(#accent)" font-size="58" font-weight="900" letter-spacing="3">PORTUGOL</text>
    <text x="544" y="217" fill="#cbd5e1" font-size="22">Lógica • Entrada • Cálculo • Saída</text>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M1035 112l-20 18 20 18">
      <animateTransform attributeName="transform" type="translate" values="0 0;-8 0;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1082 112l20 18-20 18">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1068 100l-20 62" stroke="#a5b4fc"/>
  </g>
</svg>
